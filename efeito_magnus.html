<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Simulação Efeito Magnus - O Desafio do Gol</title>
    <style>
        /* Estilos Gerais */
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #1a1a1a; color: #eee; display: flex; flex-direction: column; align-items: center; margin: 0; padding: 20px; user-select: none; }
        h1 { margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        
        /* Controles */
        .controls { background: #333; padding: 15px 25px; border-radius: 12px; display: flex; gap: 30px; margin-bottom: 20px; box-shadow: 0 6px 12px rgba(0,0,0,0.4); border: 1px solid #444; }
        .control-group { display: flex; flex-direction: column; align-items: center; }
        label { margin-bottom: 8px; font-weight: bold; font-size: 0.9em; color: #ddd; }
        input[type=range] { cursor: pointer; }
        .sub-label { font-size: 0.75em; color: #aaa; margin-top: 4px; }
        
        /* Botão */
        button { padding: 12px 30px; background: linear-gradient(145deg, #ff9800, #e68900); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 1.1rem; transition: all 0.2s; box-shadow: 0 4px #c77700; }
        button:hover { transform: translateY(-2px); box-shadow: 0 6px #c77700; }
        button:active { transform: translateY(2px); box-shadow: 0 2px #c77700; }

        /* Área do Canvas e Overlay */
        #canvas-container { position: relative; box-shadow: 0 20px 30px rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
        canvas { background: linear-gradient(to bottom, #2e8b57, #246b43); display: block; cursor: crosshair; }
        
        /* Mensagens de Gol/Erro */
        #message-overlay {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 6em; font-weight: 900; text-transform: uppercase;
            text-shadow: 3px 3px 0px #000, -3px -3px 0px #000, 3px -3px 0px #000, -3px 3px 0px #000;
            pointer-events: none; /* Permite clicar através do texto */
            display: none; /* Escondido inicialmente */
            z-index: 10;
        }
        .goal-text { color: #FFD700; animation: pulse 0.8s infinite alternate ease-in-out; }
        .miss-text { color: #ff3333; }

        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.15); text-shadow: 0 0 20px #FFD700, 3px 3px 0px #000; }
        }

        /* Legenda */
        .legend { margin-top: 15px; font-size: 0.85em; color: #ccc; display: flex; gap: 15px; background: rgba(0,0,0,0.2); padding: 8px 15px; border-radius: 20px; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    </style>
</head>
<body>

    <h1>Desafio do Efeito Magnus ⚽</h1>
    
    <div class="controls">
        <div class="control-group">
            <label for="speed">Força do Chute</label>
            <input type="range" id="speed" min="15" max="45" value="28">
        </div>
        <div class="control-group">
            <label for="spin">Efeito (Rotação/Spin)</label>
            <input type="range" id="spin" min="-35" max="35" value="18">
            <div class="sub-label">⬅️ Trivela (Esq) | Chapa (Dir) ➡️</div>
        </div>
        <div class="control-group" style="justify-content: center;">
            <button onclick="chutar()">CHUTAR!</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="field" width="800" height="550"></canvas>
        <div id="message-overlay"></div>
    </div>

    <div class="legend">
        <div><span class="dot" style="background: yellow;"></span>Rastro</div>
        <div><span class="dot" style="background: #00bfff;"></span>Velocidade</div>
        <div><span class="dot" style="background: #ff3333;"></span>Força Magnus (Empuxo Lateral)</div>
    </div>

    <script>
        const canvas = document.getElementById('field');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('message-overlay');

        // Estado do Jogo
        let gameState = 'aiming'; // 'aiming', 'flying', 'finished'

        // Física e Objetos
        // Posição Y aumentada para 500 para dar mais espaço para curva
        let ball = { x: 400, y: 500, vx: 0, vy: 0, r: 9, spin: 0, angle: 0 };
        let trail = [];
        
        // Parâmetros de Simulação
        const dt = 1/60; 
        const rho = 1.22; // Densidade ar
        const area = 0.038; // Área bola
        const mass = 0.43; // Massa bola
        const scale = 8; // Pixels por metro
        const forceScale = 35; // Escala visual das setas

        // Dimensões do Gol
        const goalX1 = 320;
        const goalX2 = 480;
        const goalLineY = 50; // A linha do gol agora é em Y=50 para caber no canvas

        function desenharCampo() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Linhas do campo
            ctx.strokeStyle = "rgba(255,255,255,0.8)";
            ctx.lineWidth = 3;
            
            // Linha de fundo (Linha do Gol)
            ctx.beginPath();
            ctx.moveTo(0, goalLineY); ctx.lineTo(canvas.width, goalLineY);
            ctx.stroke();

            // Grande área
            ctx.strokeRect(200, goalLineY, 400, 130);
            // Pequena área
            ctx.strokeRect(300, goalLineY, 200, 50);
            // Meia lua
            ctx.beginPath();
            ctx.arc(400, goalLineY + 130, 60, 0, Math.PI, false);
            ctx.stroke();
            // Ponto penal
            ctx.fillStyle = "white"; ctx.beginPath(); ctx.arc(400, goalLineY + 90, 3, 0, Math.PI * 2); ctx.fill();
            
             // Marca do chute inicial
             ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.beginPath(); ctx.arc(400, 500, 5, 0, Math.PI * 2); ctx.fill();

            // Desenhar o GOL (Traves e Rede)
            ctx.lineWidth = 6; ctx.strokeStyle = "#ddd";
            ctx.beginPath();
            // Trave esquerda
            ctx.moveTo(goalX1, goalLineY + 2); ctx.lineTo(goalX1, goalLineY - 30);
            ctx.lineTo(goalX1 + 20, goalLineY - 45); // Rede fundo
            // Trave direita
            ctx.moveTo(goalX2, goalLineY + 2); ctx.lineTo(goalX2, goalLineY - 30);
            ctx.lineTo(goalX2 - 20, goalLineY - 45); // Rede fundo
            // Travessão fundo
             ctx.moveTo(goalX1 + 20, goalLineY - 45); ctx.lineTo(goalX2 - 20, goalLineY - 45);
            ctx.stroke();
            
            // Rede (visual simples)
            ctx.lineWidth = 1; ctx.strokeStyle = "rgba(220,220,220,0.4)";
            for(let i=goalX1; i<=goalX2; i+=15) {
                 ctx.beginPath(); ctx.moveTo(i, goalLineY); ctx.lineTo(i + (i<400?20:-20), goalLineY-45); ctx.stroke();
            }
        }

        function desenharSeta(fromX, fromY, vecX, vecY, color, width) {
            const headlen = 12; 
            const angle = Math.atan2(vecY, vecX);
            // Limitar tamanho máximo visual da seta para não poluir
            let mag = Math.sqrt(vecX*vecX + vecY*vecY);
            let drawScale = forceScale;
            if (mag * drawScale > 150) drawScale = 150 / mag;

            const toX = fromX + vecX * drawScale;
            const toY = fromY + vecY * drawScale;

            ctx.beginPath();
            ctx.moveTo(fromX, fromY); ctx.lineTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle - Math.PI / 6), toY - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(toX, toY);
            ctx.lineTo(toX - headlen * Math.cos(angle + Math.PI / 6), toY - headlen * Math.sin(angle + Math.PI / 6));
            ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke();
        }

        function desenharBolaOtimizada() {
            ctx.save();
            ctx.translate(ball.x, ball.y);
            
            // Atualiza o ângulo de rotação visual baseado no spin real
            if(gameState === 'flying') {
                // Multiplicador para o giro visual parecer realista
                ball.angle += ball.spin * dt * 0.6; 
            }
            ctx.rotate(ball.angle);

            // Corpo da bola
            ctx.fillStyle = "#f0f0f0"; ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.fill();
            
            // Desenho para mostrar o giro (Cruz grossa e círculo central)
            ctx.fillStyle = "#111"; 
            ctx.beginPath(); 
            // Faixa vertical
            ctx.rect(-ball.r/5, -ball.r, ball.r/2.5, ball.r*2);
            // Faixa horizontal
            ctx.rect(-ball.r, -ball.r/5, ball.r*2, ball.r/2.5);
            ctx.fill();
            
            // Círculo central para estilo
            ctx.beginPath(); ctx.arc(0, 0, ball.r/2.5, 0, Math.PI*2); ctx.fill();
            
            // Borda externa
            ctx.strokeStyle = "#222"; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(0, 0, ball.r, 0, Math.PI * 2); ctx.stroke();
            
            ctx.restore();
        }

        function finalizarChute(resultado) {
            gameState = 'finished';
            overlay.style.display = 'block';
            if (resultado === 'gol') {
                overlay.innerText = "GOOOOOOL!";
                overlay.className = 'goal-text';
            } else {
                overlay.innerText = "SAIUUUUU!";
                overlay.className = 'miss-text';
            }
        }

        function update() {
            desenharCampo();

            // Rastro
            if(trail.length > 1) {
                ctx.beginPath(); ctx.strokeStyle = "rgba(255, 255, 0, 0.6)"; ctx.lineWidth = 4; ctx.lineCap = 'round';
                for(let i=0; i<trail.length-1; i++) {
                    ctx.moveTo(trail[i].x, trail[i].y); ctx.lineTo(trail[i+1].x, trail[i+1].y);
                }
                ctx.stroke();
            }

            if (gameState === 'flying') {
                // --- FÍSICA ---
                const vMag = Math.sqrt(ball.vx**2 + ball.vy**2);
                const nx = ball.vx / vMag; const ny = ball.vy / vMag;

                // 1. Arrasto
                const Fd = 0.5 * rho * vMag**2 * area * 0.25;
                const ax_drag = -(nx * Fd) / mass;
                const ay_drag = -(ny * Fd) / mass;

                // 2. Magnus
                const Cl = ball.spin * 0.022; // Coeficiente ajustado
                const F_magnus_mag = 0.5 * rho * vMag**2 * area * Math.abs(Cl);
                let perpX = -ny; let perpY = nx; // Direção base (spin anti-horário)
                if (ball.spin < 0) { perpX = ny; perpY = -nx; } // Inverte se spin horário

                const ax_magnus = (perpX * F_magnus_mag) / mass;
                const ay_magnus = (perpY * F_magnus_mag) / mass;

                // Integração
                ball.vx += (ax_drag + ax_magnus) * dt;
                ball.vy += (ay_drag + ay_magnus) * dt;
                ball.x += ball.vx * dt * scale;
                ball.y += ball.vy * dt * scale;

                trail.push({x: ball.x, y: ball.y});

                // --- VISUALIZAÇÃO DE FORÇAS ---
                // Seta Azul (Velocidade)
                desenharSeta(ball.x, ball.y, nx, ny, "#00bfff", 4);
                // Seta Vermelha (Magnus) - apenas se houver spin relevante
                if(Math.abs(ball.spin) > 2 && vMag > 5) {
                    // Normalizamos o vetor visualmente para a seta vermelha ficar proporcional ao Cl
                    desenharSeta(ball.x, ball.y, perpX * Math.abs(Cl)*4, perpY * Math.abs(Cl)*4, "#ff3333", 4);
                }

                // --- DETECÇÃO DE GOL/ERRO ---
                // Verifica se cruzou a linha do gol (y = goalLineY)
                if (ball.y - ball.r <= goalLineY && ball.vy < 0) {
                    // Verifica se está entre as traves
                    if (ball.x > goalX1 + ball.r && ball.x < goalX2 - ball.r) {
                        finalizarChute('gol');
                    } else if (ball.y < goalLineY - 20) {
                        // Passou da linha mas fora das traves
                         finalizarChute('fora');
                    }
                }
                
                // Verifica se saiu muito do campo
                 if(ball.y < -50 || ball.x < -50 || ball.x > canvas.width + 50 || ball.y > canvas.height + 50) {
                    finalizarChute('fora');
                }
            }

            desenharBolaOtimizada();
            requestAnimationFrame(update);
        }

        function chutar() {
            // Resetar estado
            overlay.style.display = 'none';
            gameState = 'flying';
            ball.x = 400;
            ball.y = 500;
            ball.angle = 0;
            trail = [];
            trail.push({x: ball.x, y: ball.y});

            // Pegar valores dos inputs
            const speedInput = document.getElementById('speed').value;
            ball.spin = parseFloat(document.getElementById('spin').value);
            
            // Velocidade inicial (sempre para cima, em direção ao gol)
            ball.vx = 0;
            ball.vy = -parseFloat(speedInput);
        }

        // Iniciar o loop de animação
        update();
    </script>
</body>
</html>
